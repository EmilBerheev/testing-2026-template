# Тест-кейсы (ЛР2). Формат — список YAML. Каждый кейс — отдельный элемент списка.
#
# Обязательные поля:
#   id           TC-001, TC-002, … (уникальный)
#   title        что проверяем, одной фразой
#   technique    EP | BVA | DT | ST | EG
#                (классы эквивалентности, граничные значения, таблица решений,
#                 переходы состояний, предугадывание ошибок)
#   requirement  R-01 … R-16 из docs/requirements.md
#   priority     high | medium | low
#   steps        список шагов
#   expected     ожидаемый результат
# Необязательные: preconditions, data, notes.
#
# В граничных кейсах пишите конкретные числа своего варианта, а не названия параметров:
# автопроверка ищет значения вашего варианта.
#
# Пример (раскомментируйте и замените своими кейсами):
#
# - id: TC-001
#   title: Курьерская доставка бесплатна ровно на пороге
#   technique: BVA
#   requirement: R-11
#   priority: high
#   preconditions: Каталог в исходном состоянии
#   data: {goods_total: 3000.00, delivery: courier}
#   steps:
#     - Рассчитать заказ на 3 экземпляра книги id=5 (по 1000 ₽) без карты и промокода
#     - Выбрать курьерскую доставку
#   expected: delivery_cost = 0, total = 3000.00
[]
